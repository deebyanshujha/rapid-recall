<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rapid Recall</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Luckiest+Guy&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Start Screen -->
        <div id="start-screen" class="screen">
            <h1>Rapid Recall</h1>
            <p class="subtitle">A game of quick wits and random categories.</p>
            
            <div class="setup-group">
                <label for="player-count">Number of Players:</label>
                <input type="number" id="player-count" min="2" max="10" value="2">
            </div>

            <button id="start-btn" class="btn primary">Start Game</button>
            <div id="start-error" class="error-msg"></div>
        </div>

        <!-- Game Screen -->
        <div id="game-screen" class="screen hidden">
            <div class="header">
                <div id="player-indicator" class="player-badge">Player 1</div>
                <div id="timer-container">
                    <div id="timer-bar"></div>
                </div>
            </div>

            <div class="card-container">
                <div id="category-card" class="card">
                    <span class="label">Category</span>
                    <h2 id="current-category">...</h2>
                </div>
            </div>

            <div class="input-area">
                <input type="text" id="answer-input" placeholder="Type your answer..." autocomplete="off">
                <button id="submit-btn" class="btn">Submit</button>
            </div>

            <div class="actions">
                <button id="pass-btn" class="btn secondary">Pass</button>
                <button id="end-btn" class="btn warning">End Game</button>
            </div>

            <div id="scoreboard" class="scoreboard hidden">
                <h3>Scores</h3>
                <ul id="score-list"></ul>
            </div>

            <div id="message-area" class="message"></div>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-screen" class="screen hidden">
            <h1>Game Over</h1>
            <div id="final-scores"></div>
            <p id="winner-text" class="winner"></p>
            <button id="restart-btn" class="btn primary">Play Again</button>
        </div>
    </div>

    <!-- Scripts -->
    <!-- Load data first -->
    <script src="categories.js"></script>
    <!-- Game logic -->
    <script src="script.js"></script>
</body>
</html>
